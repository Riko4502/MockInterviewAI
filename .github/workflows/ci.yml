name: CI

on:
  push:
    branches:
      - 'feature/*'
      - 'feature/**'
      - 'fix/*'
      - 'fix/**'
      - 'chore/*'
      - 'chore/**'
      - 'refactor/*'
      - 'refactor/**'
      - 'hotfix/*'
      - 'hotfix/**'
      - 'bugfix/*'
      - 'bugfix/**'
      - 'release/*'
      - 'release/**'
      - 'main'
      - 'dev'
  pull_request:
    branches:
      - 'feature/*'
      - 'feature/**'
      - 'fix/*'
      - 'fix/**'
      - 'chore/*'
      - 'chore/**'
      - 'refactor/*'
      - 'refactor/**'
      - 'hotfix/*'
      - 'hotfix/**'
      - 'bugfix/*'
      - 'bugfix/**'
      - 'release/*'
      - 'release/**'
      - 'main'
      - 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "Определение изменённых сервисов"
    runs-on: ubuntu-latest
    outputs:
      realtime: ${{ steps.filter.outputs.realtime }}
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Фильтрация изменённых путей"
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            realtime:
              - 'apps/realtime/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-realtime.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-web.yml'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-api.yml'

  realtime:
    name: "Realtime"
    needs: changes
    if: needs.changes.outputs.realtime == 'true'
    uses: ./.github/workflows/ci-realtime.yml

  web:
    name: "Web"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-web.yml

  api:
    name: "API"
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-api.yml

  security:
    name: "Security"
    uses: ./.github/workflows/ci-security.yml

  notify:
    name: "Telegram"
    needs: [realtime, web, api, security]
    if: always()
    uses: ./.github/workflows/notify-ci-telegram.yml
    secrets: inherit
    with:
      realtime_result: ${{ needs.realtime.result }}
      web_result: ${{ needs.web.result }}
      api_result: ${{ needs.api.result }}
      security_result: ${{ needs.security.result }}

  pr-status-comment:
    name: "Обновление статуса PR"
    needs: [realtime, web, api, security]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: "Формирование и обновление сводного комментария"
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-status-summary
          message: |
            ### 📊 Сводка проверок CI (Commit: `${{ github.event.pull_request.head.sha }}`)

            | Сервис | Проверка | Статус |
            | :--- | :--- | :---: |
            | 🎨 **Web (Next.js)** | TypeScript, Biome, Vitest, Lighthouse | ${{ needs.web.result == 'success' && '✅ Успешно' || (needs.web.result == 'skipped' && '⚪ Пропущен' || '❌ Ошибка') }} |
            | ⚙️ **API (Nest.js)** | Prisma Validate, Jest Unit Tests | ${{ needs.api.result == 'success' && '✅ Успешно' || (needs.api.result == 'skipped' && '⚪ Пропущен' || '❌ Ошибка') }} |
            | ⚡ **Realtime (Go)** | Go Tests, golangci-lint, govulncheck | ${{ needs.realtime.result == 'success' && '✅ Успешно' || (needs.realtime.result == 'skipped' && '⚪ Пропущен' || '❌ Ошибка') }} |
            | 🛡️ **Security** | TruffleHog (Поиск секретов) | ${{ needs.security.result == 'success' && '✅ Безопасно' || '❌ Нарушение' }} |

            *Отчет обновлен автоматически системой CI/CD.*
