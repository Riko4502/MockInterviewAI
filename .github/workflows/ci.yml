name: CI

on:
  push:
    branches:
      - 'feature/*'
      - 'feature/**'
      - 'fix/*'
      - 'fix/**'
      - 'chore/*'
      - 'chore/**'
      - 'refactor/*'
      - 'refactor/**'
      - 'hotfix/*'
      - 'hotfix/**'
      - 'bugfix/*'
      - 'bugfix/**'
      - 'release/*'
      - 'release/**'
      - 'main'
      - 'dev'
  pull_request:
    branches:
      - 'feature/*'
      - 'feature/**'
      - 'fix/*'
      - 'fix/**'
      - 'chore/*'
      - 'chore/**'
      - 'refactor/*'
      - 'refactor/**'
      - 'hotfix/*'
      - 'hotfix/**'
      - 'bugfix/*'
      - 'bugfix/**'
      - 'release/*'
      - 'release/**'
      - 'main'
      - 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "Определение изменённых сервисов"
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.timer.outputs.start_time }}
      realtime: ${{ steps.filter.outputs.realtime }}
      web: ${{ steps.filter.outputs.web }}
      landing: ${{ steps.filter.outputs.landing }}
      api: ${{ steps.filter.outputs.api }}
      storybook: ${{ steps.filter.outputs.storybook }}
      docker_realtime: ${{ steps.filter.outputs.docker_realtime }}
      docker_web: ${{ steps.filter.outputs.docker_web }}
      docker_landing: ${{ steps.filter.outputs.docker_landing }}
      docker_api: ${{ steps.filter.outputs.docker_api }}
    steps:
      - name: "Фиксация времени старта"
        id: timer
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Фильтрация изменённых путей"
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            realtime:
              - 'apps/realtime/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-realtime.yml'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/icons/**'
              - 'packages/tailwind-config/**'
              - 'packages/dto/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-web.yml'
            api:
              - 'apps/api/**'
              - 'packages/dto/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-api.yml'
            landing:
              - 'apps/landing/**'
              - 'packages/ui/**'
              - 'packages/icons/**'
              - 'packages/tailwind-config/**'
              - 'packages/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-landing.yml'
            storybook:
              - 'apps/ui-docs/**'
              - 'packages/ui/**'
              - 'packages/icons/**'
              - 'packages/tailwind-config/**'
              - 'packages/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-storybook.yml'
            docker_realtime:
              - 'apps/realtime/Dockerfile*'
              - 'apps/realtime/go.mod'
              - 'apps/realtime/go.sum'
              - '.dockerignore'
            docker_web:
              - 'apps/web/Dockerfile*'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            docker_api:
              - 'apps/api/Dockerfile*'
              - 'apps/api/prisma/**'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            docker_landing:
              - 'apps/landing/Dockerfile*'
              - 'apps/landing/nginx.conf'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  realtime:
    name: "Realtime"
    needs: changes
    if: needs.changes.outputs.realtime == 'true'
    uses: ./.github/workflows/ci-realtime.yml
    with:
      should_build_docker: ${{ github.ref_name == 'dev' || github.ref_name == 'main' || needs.changes.outputs.docker_realtime == 'true' }}

  web:
    name: "Web"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-web.yml
    with:
      should_build_docker: ${{ github.ref_name == 'dev' || github.ref_name == 'main' || needs.changes.outputs.docker_web == 'true' }}

  api:
    name: "API"
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-api.yml
    with:
      should_build_docker: ${{ github.ref_name == 'dev' || github.ref_name == 'main' || needs.changes.outputs.docker_api == 'true' }}

  landing:
    name: "Landing"
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    uses: ./.github/workflows/ci-landing.yml
    with:
      should_build_docker: ${{ github.ref_name == 'dev' || github.ref_name == 'main' || needs.changes.outputs.docker_landing == 'true' }}

  storybook:
    name: "Storybook"
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    uses: ./.github/workflows/ci-storybook.yml

  security:
    name: "Security"
    uses: ./.github/workflows/ci-security.yml

  notify:
    name: "Telegram"
    needs: [changes, realtime, web, api, security, landing, storybook]
    if: always()
    uses: ./.github/workflows/notify-ci-telegram.yml
    secrets: inherit
    with:
      start_time: ${{ needs.changes.outputs.start_time }}
      realtime_result: ${{ needs.realtime.result }}
      realtime_coverage: ${{ needs.realtime.outputs.coverage || '' }}
      web_result: ${{ needs.web.result }}
      web_coverage: ${{ needs.web.outputs.coverage || '' }}
      landing_result: ${{ needs.landing.result }}
      landing_coverage: ${{ needs.landing.outputs.coverage || '' }}
      api_result: ${{ needs.api.result }}
      api_coverage: ${{ needs.api.outputs.coverage || '' }}
      storybook_result: ${{ needs.storybook.result }}
      storybook_coverage: ${{ needs.storybook.outputs.coverage || '' }}
      security_result: ${{ needs.security.result }}

  pr-status-comment:
    name: "Обновление статуса PR"
    needs: [realtime, web, api, landing, storybook, security]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Генерация отчета из шаблона"
        run: |
          sed -e "s|{{SHA}}|${{ github.event.pull_request.head.sha }}|g" \
              -e "s|{{WEB_COV}}|${{ needs.web.outputs.coverage || '—' }}|g" \
              -e "s|{{WEB_STATUS}}|${{ needs.web.result == 'success' && '✅ Успешно' || (needs.web.result == 'skipped' && '⚪ Пропущен' || '❌ Ошибка') }}|g" \
              -e "s|{{LANDING_COV}}|${{ needs.landing.outputs.coverage || '—' }}|g" \
              -e "s|{{LANDING_STATUS}}|${{ needs.landing.result == 'success' && '✅ Успешно' || (needs.landing.result == 'skipped' && '⚪ Пропущен' || '❌ Ошибка') }}|g" \
              -e "s|{{API_COV}}|${{ needs.api.outputs.coverage || '—' }}|g" \
              -e "s|{{API_STATUS}}|${{ needs.api.result == 'success' && '✅ Успешно' || (needs.api.result == 'skipped' && '⚪ Пропущен' || '❌ Ошибка') }}|g" \
              -e "s|{{REALTIME_COV}}|${{ needs.realtime.outputs.coverage || '—' }}|g" \
              -e "s|{{REALTIME_STATUS}}|${{ needs.realtime.result == 'success' && '✅ Успешно' || (needs.realtime.result == 'skipped' && '⚪ Пропущен' || '❌ Ошибка') }}|g" \
              -e "s|{{STORYBOOK_COV}}|${{ needs.storybook.outputs.coverage || '—' }}|g" \
              -e "s|{{STORYBOOK_STATUS}}|${{ needs.storybook.result == 'success' && '✅ Успешно' || (needs.storybook.result == 'skipped' && '⚪ Пропущен' || '❌ Ошибка') }}|g" \
              -e "s|{{SECURITY_STATUS}}|${{ needs.security.result == 'success' && '✅ Безопасно' || '❌ Нарушение' }}|g" \
              .github/templates/pr-status-summary.md > pr-comment.md

      - name: "Публикация сводного комментария"
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-status-summary
          path: pr-comment.md
