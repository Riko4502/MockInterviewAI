name: CI

on:
  push:
    branches:
      - 'feature/*'
      - 'feature/**'
      - 'fix/*'
      - 'fix/**'
      - 'chore/*'
      - 'chore/**'
      - 'refactor/*'
      - 'refactor/**'
      - 'main'
      - 'dev'
  pull_request:
    branches:
      - 'feature/*'
      - 'feature/**'
      - 'fix/*'
      - 'fix/**'
      - 'chore/*'
      - 'chore/**'
      - 'refactor/*'
      - 'refactor/**'
      - 'main'
      - 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "Определение изменённых сервисов"
    runs-on: ubuntu-latest
    outputs:
      realtime: ${{ steps.filter.outputs.realtime }}
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Фильтрация изменённых путей"
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            realtime:
              - 'apps/realtime/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'

  test-realtime:
    name: "Тесты сервиса Realtime (Go)"
    needs: changes
    if: needs.changes.outputs.realtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия сервиса Realtime (go.mod)"
        id: check_realtime
        run: |
          if [ -f "apps/realtime/go.mod" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Установка Go"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/realtime/go.mod'
          cache-dependency-path: 'apps/realtime/go.sum'

      - name: "Запуск unit-тестов Go"
        if: steps.check_realtime.outputs.exists == 'true'
        working-directory: apps/realtime
        run: go test -v -race ./...

  security-realtime:
    name: "Безопасность и SAST-анализ Realtime (Go)"
    needs: changes
    if: needs.changes.outputs.realtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия сервиса Realtime (go.mod)"
        id: check_realtime
        run: |
          if [ -f "apps/realtime/go.mod" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Установка Go"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/realtime/go.mod'
          cache-dependency-path: 'apps/realtime/go.sum'

      - name: "Проверка уязвимостей в зависимостях (govulncheck)"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: 'apps/realtime/go.mod'
          work-dir: 'apps/realtime'

      - name: "Запуск линтера и статического анализа (golangci-lint)"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: apps/realtime
          args: --timeout=5m

  test-web:
    name: "Тесты веб-приложения (Next.js / Vitest)"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: "Установка зависимостей (frozen-lockfile)"
        run: pnpm install --frozen-lockfile

      - name: "Восстановление / сохранение кэша Turborepo"
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: "Запуск тестов фронтенда"
        run: pnpm --filter web test

  test-api:
    name: "Тесты и сборка API Backend (Nest.js)"
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия сервиса API (apps/api)"
        id: check_api
        run: |
          if [ -d "apps/api" ] && [ -f "apps/api/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Установка pnpm"
        if: steps.check_api.outputs.exists == 'true'
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        if: steps.check_api.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: "Установка зависимостей (frozen-lockfile)"
        if: steps.check_api.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: "Восстановление / сохранение кэша Turborepo"
        if: steps.check_api.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: "Запуск тестов и сборки Nest.js"
        if: steps.check_api.outputs.exists == 'true'
        run: pnpm --filter @apps/api test || pnpm --filter api test || pnpm turbo run build --filter=...api

  security-web:
    name: "Аудит безопасности зависимостей (pnpm audit)"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Проверка уязвимостей в пакетах (pnpm audit)"
        run: pnpm audit --audit-level=high

  security-secrets:
    name: "Сканирование на утечки секретов (TruffleHog)"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория с полной историей"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Сканирование коммитов на ключи и токены"
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
