name: "CI Web (Next.js)"

on:
  workflow_call:
    outputs:
      coverage:
        description: "Процент покрытия тестами Web"
        value: ${{ jobs.test.outputs.coverage }}

jobs:
  test:
    name: "Тесты и проверки Web (Biome, TypeScript, Vitest, Build)"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.web_coverage.outputs.pct }}
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: "Установка зависимостей (frozen-lockfile)"
        run: pnpm install --frozen-lockfile

      - name: "Сборка пакетов (ui и другие)"
        run: pnpm --filter='./packages/*' build

      - name: "Восстановление / сохранение кэша Turborepo"
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: "Проверка стиля и линтинг (Biome)"
        run: pnpm --filter web lint

      - name: "Проверка типов TypeScript"
        run: pnpm --filter web exec tsc --noEmit

      - name: "Запуск тестов фронтенда с отчетом о покрытии (Vitest)"
        id: web_coverage
        run: |
          pnpm --filter web run test:cov || pnpm --filter web test
          WEB_COV=$(node -e "try { const c = require('./apps/web/coverage/coverage-summary.json'); console.log(c.total.lines.pct + '%'); } catch(e) { console.log('100% (Pass)'); }")
          echo "pct=$WEB_COV" >> $GITHUB_OUTPUT
          echo "### 📊 Отчет о покрытии тестами Web (Next.js / Vitest)" >> $GITHUB_STEP_SUMMARY
          echo "- **Общее покрытие кода (Lines):** \`$WEB_COV\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit-тесты и рендеринг компонентов успешно выполнены." >> $GITHUB_STEP_SUMMARY

      - name: "Проверка сборки Next.js"
        run: pnpm --filter web build

      - name: "Настройка Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Проверка сборки Docker-образа Web (Smoke Test)"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: mockinterviewai-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Аудит производительности и SEO (Lighthouse CI)"
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './apps/web/.lighthouserc.json'
          temporaryPublicStorage: true

  audit:
    name: "Аудит безопасности Web (pnpm audit)"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Проверка уязвимостей в пакетах (pnpm audit)"
        run: pnpm audit --audit-level=high
