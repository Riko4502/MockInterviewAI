name: "E2E Smoke Tests (Playwright)"

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e-smoke.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: "Playwright Smoke Tests (Chromium)"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: "Установка зависимостей (frozen-lockfile)"
        run: pnpm install --frozen-lockfile

      - name: "Сборка пакетов монорепозитория"
        run: pnpm --filter='./packages/*' build

      - name: "Сборка Next.js приложения"
        run: pnpm --filter web build

      - name: "Кэширование браузеров Playwright"
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: "Установка Chromium для Playwright"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: "Установка системных зависимостей Playwright"
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      - name: "Запуск E2E Smoke тестов"
        run: pnpm --filter web run test:e2e

      - name: "Загрузка артефактов отчета Playwright при ошибке"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
