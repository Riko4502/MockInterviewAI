name: "PR Auto-Labeler"

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: "Автоматическая расстановка меток"
    runs-on: ubuntu-latest
    steps:
      - name: "Развешивание меток по путям"
        uses: actions/labeler@v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: ".github/labeler.yml"
          sync-labels: true
