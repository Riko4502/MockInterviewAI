name: "Semantic PR Check"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read
  statuses: write

jobs:
  validate-title:
    name: "Проверка заголовка PR (Conventional Commits)"
    runs-on: ubuntu-latest
    steps:
      - name: "Валидация заголовка PR"
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            release
          requireScope: false
          validateSingleCommit: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "Описание PR должно начинаться с маленькой буквы или цифры."
