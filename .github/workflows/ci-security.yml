name: "CI Security (Secrets & Docker Lint)"

on:
  workflow_call:

jobs:
  secrets-scan:
    name: "Поиск утечек секретов (TruffleHog)"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория с полной историей"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Сканирование коммитов на ключи и токены"
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  docker-lint:
    name: "Линтинг Dockerfile (Hadolint)"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка всех Dockerfile на безопасность и ошибки"
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          failure-threshold: error

  node-version:
    name: "Единый источник версии Node.js"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка Node.js"
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: "Проверка соответствия .node-version, engines.node и node-version-file"
        run: |
          set -euo pipefail

          file_version="$(tr -d '[:space:]' < .node-version)"
          expected="${file_version}.x"

          # Vercel берёт версию из engines.node корневого package.json, а в
          # vercel.json такого поля нет: схема openapi.vercel.sh/vercel.json
          # задаёт additionalProperties: false, и его нарушение валит деплой.
          # ?.engines?.node: отсутствие engines должно давать внятное MISMATCH,
          # а не TypeError из node -p.
          value="$(node -p "require('./package.json')?.engines?.node ?? 'MISSING'")"

          echo ".node-version = ${file_version}"
          echo "package.json engines.node = ${value}"
          if [ "${value}" != "${expected}" ]; then
            echo "::error file=package.json::engines.node (${value}) does not match .node-version (${file_version})"
            exit 1
          fi

          if grep -rnE '"engines"[[:space:]]*:' --include=vercel.json \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::В vercel.json найдено поле engines. Его нет в схеме Vercel (additionalProperties: false), поэтому деплой падает. Версия Node задаётся в engines.node корневого package.json."
            exit 1
          fi

          # Требуется значение после двоеточия, иначе под шаблон попадает сам
          # ключ job `node-version:` в этом же файле и текст самой проверки.
          if grep -rnE '^[[:space:]]*node-version:[[:space:]]*[^[:space:]]' .github/workflows/; then
            echo "::error::В workflow найден литерал версии Node. Версия читается только из .node-version, иначе разнобой вернётся (ADR-006)."
            exit 1
          fi

          echo "Версия Node задана в одном месте: .node-version, engines.node и node-version-file согласованы, vercel.json не переопределяет версию"

  dependency-audit:
    name: "Аудит безопасности зависимостей (pnpm audit)"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: "Проверка уязвимостей в пакетах (pnpm audit)"
        run: pnpm audit --audit-level=high

