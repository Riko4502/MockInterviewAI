name: "CI Realtime (Go)"

on:
  workflow_call:
    inputs:
      should_build_docker:
        type: boolean
        default: true
        description: "Флаг запуска сборки Docker"
    outputs:
      coverage:
        description: "Процент покрытия тестами Realtime"
        value: ${{ jobs.test.outputs.coverage }}

jobs:
  sse-events-generated:
    name: "Актуальность сгенерированных Go-констант SSE-событий"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия сервиса Realtime (go.mod)"
        id: check_realtime
        run: |
          if [ -f "apps/realtime/go.mod" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Установка pnpm"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      # Словарь событий живёт в packages/dto, а компилятором TypeScript и Go не
      # связаны: без этой проверки изменение словаря без перегенерации прошло бы
      # незамеченным (ADR-004:142). Генератор читает исходник напрямую, поэтому
      # сборка пакетов здесь не нужна.
      - name: "Установка зависимостей (frozen-lockfile)"
        if: steps.check_realtime.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: "Перегенерация Go-констант из словаря событий"
        if: steps.check_realtime.outputs.exists == 'true'
        run: pnpm --filter @packages/dto run generate:go

      - name: "Проверка, что events_gen.go совпадает со словарём"
        if: steps.check_realtime.outputs.exists == 'true'
        run: |
          if ! git diff --quiet -- apps/realtime/internal/sse/events_gen.go; then
            echo "::error::apps/realtime/internal/sse/events_gen.go разошёлся со словарём packages/dto/src/realtime/sse-event.dto.ts. Выполните pnpm --filter @packages/dto run generate:go и закоммитьте результат."
            git --no-pager diff -- apps/realtime/internal/sse/events_gen.go
            exit 1
          fi

  test:
    name: "Unit-тесты Go"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.go_coverage.outputs.pct }}
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия сервиса Realtime (go.mod)"
        id: check_realtime
        run: |
          if [ -f "apps/realtime/go.mod" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Установка Go"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'apps/realtime/go.mod'
          cache-dependency-path: 'apps/realtime/go.sum'

      - name: "Запуск unit-тестов Go с отчетом о покрытии"
        id: go_coverage
        if: steps.check_realtime.outputs.exists == 'true'
        working-directory: apps/realtime
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          TOTAL_COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "pct=$TOTAL_COV" >> $GITHUB_OUTPUT
          echo "### 📊 Отчет о покрытии тестами Realtime (Go)" >> $GITHUB_STEP_SUMMARY
          echo "- **Общее покрытие кода (Statements):** \`$TOTAL_COV\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit-тесты Realtime успешно выполнены." >> $GITHUB_STEP_SUMMARY

  security:
    name: "SAST и аудит Go"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия сервиса Realtime (go.mod)"
        id: check_realtime
        run: |
          if [ -f "apps/realtime/go.mod" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Установка Go"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'apps/realtime/go.mod'
          cache-dependency-path: 'apps/realtime/go.sum'

      - name: "Загрузка зависимостей Go"
        if: steps.check_realtime.outputs.exists == 'true'
        working-directory: apps/realtime
        run: go mod download

      - name: "Проверка уязвимостей в зависимостях (govulncheck)"
        if: steps.check_realtime.outputs.exists == 'true'
        working-directory: apps/realtime
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: "Запуск линтера и статического анализа (go vet & revive)"
        if: steps.check_realtime.outputs.exists == 'true'
        working-directory: apps/realtime
        run: |
          go vet ./...
          go install github.com/mgechev/revive@latest
          revive -config .revive.toml -formatter friendly ./...

      - name: "Настройка Docker Buildx"
        if: steps.check_realtime.outputs.exists == 'true' && inputs.should_build_docker
        uses: docker/setup-buildx-action@v4

      - name: "Проверка сборки Docker-образа Realtime (Smoke Test)"
        if: steps.check_realtime.outputs.exists == 'true' && inputs.should_build_docker
        uses: docker/build-push-action@v7
        with:
          context: ./apps/realtime
          file: ./apps/realtime/Dockerfile
          push: false
          tags: mockinterviewai-realtime:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
