name: "CI Realtime (Go)"

on:
  workflow_call:
    outputs:
      coverage:
        description: "Процент покрытия тестами Realtime"
        value: ${{ jobs.test.outputs.coverage }}

jobs:
  test:
    name: "Unit-тесты Go"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.go_coverage.outputs.pct }}
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия сервиса Realtime (go.mod)"
        id: check_realtime
        run: |
          if [ -f "apps/realtime/go.mod" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Установка Go"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'apps/realtime/go.mod'
          cache-dependency-path: 'apps/realtime/go.sum'

      - name: "Запуск unit-тестов Go с отчетом о покрытии"
        id: go_coverage
        if: steps.check_realtime.outputs.exists == 'true'
        working-directory: apps/realtime
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          TOTAL_COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "pct=$TOTAL_COV" >> $GITHUB_OUTPUT
          echo "### 📊 Отчет о покрытии тестами Realtime (Go)" >> $GITHUB_STEP_SUMMARY
          echo "- **Общее покрытие кода (Statements):** \`$TOTAL_COV\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit-тесты Realtime успешно выполнены." >> $GITHUB_STEP_SUMMARY

  security:
    name: "SAST и аудит Go"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия сервиса Realtime (go.mod)"
        id: check_realtime
        run: |
          if [ -f "apps/realtime/go.mod" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Установка Go"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'apps/realtime/go.mod'
          cache-dependency-path: 'apps/realtime/go.sum'

      - name: "Загрузка зависимостей Go"
        if: steps.check_realtime.outputs.exists == 'true'
        working-directory: apps/realtime
        run: go mod download

      - name: "Проверка уязвимостей в зависимостях (govulncheck)"
        if: steps.check_realtime.outputs.exists == 'true'
        working-directory: apps/realtime
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: "Запуск линтера и статического анализа (go vet & revive)"
        if: steps.check_realtime.outputs.exists == 'true'
        working-directory: apps/realtime
        run: |
          go vet ./...
          go install github.com/mgechev/revive@latest
          revive -config .revive.toml -formatter friendly ./...

      - name: "Настройка Docker Buildx"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: "Проверка сборки Docker-образа Realtime (Smoke Test)"
        if: steps.check_realtime.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/realtime
          file: ./apps/realtime/Dockerfile
          push: false
          tags: mockinterviewai-realtime:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
