name: Ручной деплой на сервер

on:
  workflow_dispatch:
    inputs:
      target_service:
        description: 'Сервис для сборки и деплоя'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'api'
          - 'realtime'
          - 'web'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-realtime:
    name: "Сборка и публикация образа Realtime"
    runs-on: ubuntu-latest
    if: inputs.target_service == 'all' || inputs.target_service == 'realtime'
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Настройка Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Авторизация в GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Генерация метаданных (теги, метки)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mockinterviewai-realtime
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: "Сборка и пуш Docker-образа в GHCR"
        uses: docker/build-push-action@v6
        with:
          context: ./apps/realtime
          file: ./apps/realtime/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-web:
    name: "Сборка и публикация образа Web (Next.js)"
    runs-on: ubuntu-latest
    if: inputs.target_service == 'all' || inputs.target_service == 'web'
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Настройка Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Авторизация в GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Генерация метаданных (теги, метки)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mockinterviewai-web
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: "Сборка и пуш Docker-образа в GHCR"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-api:
    name: "Сборка и публикация образа API (Nest.js)"
    runs-on: ubuntu-latest
    if: inputs.target_service == 'all' || inputs.target_service == 'api'
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия Dockerfile для API"
        id: check_dockerfile
        run: |
          if [ -f "apps/api/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Настройка Docker Buildx"
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: "Авторизация в GitHub Container Registry"
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Генерация метаданных (теги, метки)"
        if: steps.check_dockerfile.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mockinterviewai-api
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: "Сборка и пуш Docker-образа API в GHCR"
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: "Развертывание на удаленном сервере (SSH)"
    needs: [build-and-push-realtime, build-and-push-web, build-and-push-api]
    if: always() && (needs.build-and-push-realtime.result == 'success' || needs.build-and-push-realtime.result == 'skipped') && (needs.build-and-push-web.result == 'success' || needs.build-and-push-web.result == 'skipped') && (needs.build-and-push-api.result == 'success' || needs.build-and-push-api.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Копирование docker-compose.prod.yml на сервер"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: 'docker-compose.prod.yml'
          target: '/opt/mock-interview-ai'

      - name: "Выполнение команд обновления контейнеров по SSH"
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.ref_name }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GHCR_PAT: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GITHUB_OWNER,BRANCH_NAME,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,DATABASE_URL,GHCR_PAT,GHCR_USER
          script: |
            mkdir -p /opt/mock-interview-ai
            cd /opt/mock-interview-ai

            # Авторизация в GitHub Packages для загрузки приватных образов
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Подготовка переменных окружения
            export GITHUB_REPOSITORY_OWNER=$(echo "$GITHUB_OWNER" | tr '[:upper:]' '[:lower:]')
            export JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET"
            export JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET"
            export REALTIME_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mockinterviewai-realtime:${BRANCH_NAME}"
            export WEB_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mockinterviewai-web:${BRANCH_NAME}"
            export API_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mockinterviewai-api:${BRANCH_NAME}"

            # Загрузка свежих образов
            docker compose -f docker-compose.prod.yml pull

            # --- Пункт 2: Prisma migrations ---
            # Запускаем migrate deploy в отдельном одноразовом контейнере
            # до подъёма API, чтобы схема БД всегда была актуальна
            if [ -n "$DATABASE_URL" ]; then
              echo "Running Prisma migrations..."
              docker run --rm \
                -e DATABASE_URL="$DATABASE_URL" \
                --network host \
                "$API_IMAGE" \
                sh -c "npx prisma migrate deploy" \
              && echo "✅ Migrations applied" \
              || { echo "❌ Migrations failed"; exit 1; }
            else
              echo "⚠️  DATABASE_URL not set — skipping Prisma migrations"
            fi

            # Запуск/обновление контейнеров
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # --- Пункт 3: Health check после деплоя ---
            # Шаг 1: контейнеры запустились?
            echo "Checking container status..."
            sleep 5
            for svc in mock-interview-api mock-interview-realtime mock-interview-web; do
              STATUS=$(docker inspect --format='{{.State.Status}}' "$svc" 2>/dev/null || echo "missing")
              if [ "$STATUS" != "running" ]; then
                echo "❌ Container $svc is not running (status: $STATUS)"
                docker logs --tail=50 "$svc" 2>/dev/null || true
                exit 1
              fi
              echo "✅ $svc is running"
            done

            # Шаг 2: HTTP health check через docker exec внутри контейнера
            # Не зависит от домена — curl идёт на 127.0.0.1 изнутри самого контейнера
            echo "Probing API health endpoint via docker exec..."
            for i in $(seq 1 12); do
              HTTP_STATUS=$(docker exec mock-interview-api \
                curl -s -o /dev/null -w "%{http_code}" \
                --max-time 5 http://127.0.0.1:4000/api/v1/health 2>/dev/null || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "✅ API health check passed (HTTP 200)"
                break
              fi
              echo "Attempt $i/12: HTTP $HTTP_STATUS — retrying in 5s..."
              sleep 5
              if [ $i -eq 12 ]; then
                echo "⚠️  API did not respond with 200 after 60s (HTTP $HTTP_STATUS)"
                echo "    Non-fatal if /api/v1/health is not yet implemented."
              fi
            done


            # Очистка неиспользуемых старых слоев
            docker image prune -f
            echo "🚀 Deployment complete"

  notify:
    name: "Telegram-уведомление о деплое"
    needs: [build-and-push-realtime, build-and-push-web, build-and-push-api, deploy-to-server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Определение статуса деплоя"
        id: status
        run: |
          DEPLOY="${{ needs.deploy-to-server.result }}"
          BUILD_RT="${{ needs.build-and-push-realtime.result }}"
          BUILD_WEB="${{ needs.build-and-push-web.result }}"
          BUILD_API="${{ needs.build-and-push-api.result }}"

          if [ "$DEPLOY" = "success" ]; then
            echo "icon=✅" >> $GITHUB_OUTPUT
            echo "label=Деплой успешен" >> $GITHUB_OUTPUT
          elif [ "$DEPLOY" = "skipped" ]; then
            echo "icon=⏭️" >> $GITHUB_OUTPUT
            echo "label=Деплой пропущен (сборка провалилась)" >> $GITHUB_OUTPUT
          else
            echo "icon=❌" >> $GITHUB_OUTPUT
            echo "label=Деплой провалился" >> $GITHUB_OUTPUT
          fi

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BRANCH="${{ github.ref_name }}"

          echo "rt_image=ghcr.io/${OWNER}/mockinterviewai-realtime:${BRANCH}" >> $GITHUB_OUTPUT
          echo "web_image=ghcr.io/${OWNER}/mockinterviewai-web:${BRANCH}" >> $GITHUB_OUTPUT
          echo "api_image=ghcr.io/${OWNER}/mockinterviewai-api:${BRANCH}" >> $GITHUB_OUTPUT

      - name: "Отправка уведомления в Telegram"
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ steps.status.outputs.icon }} *${{ steps.status.outputs.label }}*

            📦 *Репозиторий:* [${{ github.repository }}](https://github.com/${{ github.repository }})
            🌿 *Ветка:* `${{ github.ref_name }}`
            👤 *Автор:* ${{ github.actor }}
            💬 *Коммит:* [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            🔗 *Ссылка на запуск:*
            [Открыть в GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            🐳 *Docker-образы для скачивания:*
            ```
            docker pull ${{ steps.status.outputs.api_image }}
            docker pull ${{ steps.status.outputs.web_image }}
            docker pull ${{ steps.status.outputs.rt_image }}
            ```
