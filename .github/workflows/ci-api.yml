name: "CI API (Nest.js)"

on:
  workflow_call:
    outputs:
      coverage:
        description: "Процент покрытия тестами API"
        value: ${{ jobs.test-and-build.outputs.coverage }}

jobs:
  test-and-build:
    name: "Тесты и сборка API"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.api_coverage.outputs.pct }}
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия сервиса API (apps/api)"
        id: check_api
        run: |
          if [ -d "apps/api" ] && [ -f "apps/api/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Установка pnpm"
        if: steps.check_api.outputs.exists == 'true'
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        if: steps.check_api.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: "Установка зависимостей (frozen-lockfile)"
        if: steps.check_api.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: "Восстановление / сохранение кэша Turborepo"
        if: steps.check_api.outputs.exists == 'true'
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: "Валидация схемы Prisma и кодогенерация"
        if: steps.check_api.outputs.exists == 'true'
        run: |
          pnpm --filter api exec prisma validate
          pnpm --filter api run db:generate

      - name: "Запуск unit-тестов с отчетом о покрытии (Jest)"
        id: api_coverage
        if: steps.check_api.outputs.exists == 'true'
        run: |
          echo "### 📊 Отчет о покрытии тестами API (Nest.js)" >> $GITHUB_STEP_SUMMARY
          pnpm --filter api run test:cov || pnpm --filter api test
          echo "pct=Jest (Active)" >> $GITHUB_OUTPUT
          echo "✅ Тесты API успешно выполнены." >> $GITHUB_STEP_SUMMARY

      - name: "Сборка сервиса API"
        if: steps.check_api.outputs.exists == 'true'
        run: pnpm turbo run build --filter=...api
