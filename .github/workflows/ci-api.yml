name: "CI API (Nest.js)"

on:
  workflow_call:
    inputs:
      should_build_docker:
        type: boolean
        default: true
        description: "Флаг запуска сборки Docker"
    outputs:
      coverage:
        description: "Процент покрытия тестами API"
        value: ${{ jobs.test-and-build.outputs.coverage }}

jobs:
  test-and-build:
    name: "Тесты и сборка API"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.api_coverage.outputs.pct }}
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Проверка наличия сервиса API (apps/api)"
        id: check_api
        run: |
          if [ -d "apps/api" ] && [ -f "apps/api/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Установка pnpm"
        if: steps.check_api.outputs.exists == 'true'
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        if: steps.check_api.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: "Установка зависимостей (frozen-lockfile)"
        if: steps.check_api.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: "Восстановление / сохранение кэша Turborepo"
        if: steps.check_api.outputs.exists == 'true'
        uses: actions/cache@v6
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-api-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-api-
            ${{ runner.os }}-turbo-

      - name: "Сборка зависимостей API (@packages/dto, @packages/utils)"
        if: steps.check_api.outputs.exists == 'true'
        run: pnpm turbo run build --filter=api^...

      - name: "Проверка расхождений сгенерированного API-клиента (Codegen Drift Check)"
        if: steps.check_api.outputs.exists == 'true'
        run: pnpm run codegen:check

      - name: "Валидация схемы Prisma и кодогенерация"
        if: steps.check_api.outputs.exists == 'true'
        run: |
          pnpm --filter api exec prisma validate
          pnpm --filter api run db:generate

      - name: "Запуск unit-тестов с отчетом о покрытии (Jest)"
        id: api_coverage
        if: steps.check_api.outputs.exists == 'true'
        run: |
          pnpm --filter api run test:cov || pnpm --filter api test
          API_COV=$(node -e "try { const c = require('./apps/api/coverage/coverage-summary.json'); console.log(c.total.lines.pct + '%'); } catch(e) { console.log('—'); }")
          echo "pct=$API_COV" >> $GITHUB_OUTPUT
          echo "### 📊 Отчет о покрытии тестами API (Nest.js)" >> $GITHUB_STEP_SUMMARY
          echo "- **Общее покрытие кода (Lines):** \`$API_COV\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ Тесты API успешно выполнены." >> $GITHUB_STEP_SUMMARY

      - name: "Сборка сервиса API"
        if: steps.check_api.outputs.exists == 'true'
        run: pnpm turbo run build --filter=...api

      - name: "Настройка Docker Buildx"
        if: steps.check_api.outputs.exists == 'true' && inputs.should_build_docker
        uses: docker/setup-buildx-action@v4

      - name: "Проверка сборки Docker-образа API (Smoke Test)"
        if: steps.check_api.outputs.exists == 'true' && inputs.should_build_docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: mockinterviewai-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
