name: "CI Landing (Astro)"

on:
  workflow_call: {}

jobs:
  landing:
    name: "Тесты и проверки Landing (Astro Check, Vitest, Build)"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: "Установка зависимостей (frozen-lockfile)"
        run: pnpm install --frozen-lockfile

      - name: "Восстановление / сохранение кэша Turborepo"
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: "Линтинг – Landing"
        run: pnpm --filter landing lint

      - name: "Проверка типов (Astro Check)"
        run: pnpm --filter landing check

      - name: "Запуск тестов (Vitest)"
        run: pnpm --filter landing test

      - name: "Сборка проекта"
        run: pnpm --filter landing build
