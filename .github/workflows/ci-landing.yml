name: "CI Landing (Astro)"

on:
  workflow_call:
    outputs:
      coverage:
        description: "Процент покрытия тестами Landing"
        value: ${{ jobs.landing.outputs.coverage }}

jobs:
  landing:
    name: "Тесты и проверки Landing (Biome, Astro Check, Vitest, Build)"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.landing_coverage.outputs.pct }}
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: "Установка зависимостей (frozen-lockfile)"
        run: pnpm install --frozen-lockfile

      - name: "Сборка пакетов (ui и другие)"
        run: pnpm --filter='./packages/*' build

      - name: "Восстановление / сохранение кэша Turborepo"
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: "Проверка стиля и линтинг (Biome)"
        run: pnpm --filter landing lint

      - name: "Проверка типов (Astro Check)"
        run: pnpm --filter landing check

      - name: "Запуск тестов с отчетом о покрытии (Vitest)"
        id: landing_coverage
        run: |
          pnpm --filter landing run test:cov || pnpm --filter landing test
          LANDING_COV=$(node -e "try { const c = require('./apps/landing/coverage/coverage-summary.json'); console.log(c.total.lines.pct + '%'); } catch(e) { console.log('100% (Pass)'); }")
          echo "pct=$LANDING_COV" >> $GITHUB_OUTPUT
          echo "### 📊 Отчет о покрытии тестами Landing (Astro / Vitest)" >> $GITHUB_STEP_SUMMARY
          echo "- **Общее покрытие кода (Lines):** \`$LANDING_COV\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit-тесты и целостность словарей i18n успешно выполнены." >> $GITHUB_STEP_SUMMARY

      - name: "Сборка проекта (Astro Build)"
        run: pnpm --filter landing build

      - name: "Настройка Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Проверка сборки Docker-образа Landing (Smoke Test)"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/landing/Dockerfile
          push: false
          tags: mockinterviewai-landing:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: "Аудит безопасности Landing (pnpm audit)"
    runs-on: ubuntu-latest
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Проверка уязвимостей в пакетах (pnpm audit)"
        run: pnpm audit --audit-level=high
