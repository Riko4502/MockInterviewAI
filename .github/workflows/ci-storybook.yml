name: "CI Storybook (ui-docs)"

on:
  workflow_call:
    outputs:
      coverage:
        description: "Результат сборки Storybook"
        value: ${{ jobs.test.outputs.coverage }}

jobs:
  test:
    name: "Сборка и проверка Storybook (apps/ui-docs)"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.storybook_build.outputs.pct }}
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: "Установка зависимостей (frozen-lockfile)"
        run: pnpm install --frozen-lockfile

      - name: "Сборка @packages/icons"
        run: pnpm --filter=@packages/icons run build

      - name: "Проверка типов TypeScript (@packages/icons)"
        run: pnpm --filter=@packages/icons run typecheck

      - name: "Сборка @packages/ui"
        run: pnpm --filter=@packages/ui run build

      - name: "Проверка типов TypeScript (@packages/ui)"
        run: pnpm --filter=@packages/ui run typecheck

      - name: "Проверка типов TypeScript (ui-docs)"
        run: pnpm --filter=ui-docs run typecheck

      - name: "Восстановление / сохранение кэша Turborepo"
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: "Сборка Storybook (build-storybook)"
        id: storybook_build
        run: |
          pnpm --filter=ui-docs run build-storybook
          echo "pct=OK" >> $GITHUB_OUTPUT
          echo "### 📚 Отчет Storybook (apps/ui-docs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Сборка Storybook (Rsbuild):** ✅ успешно" >> $GITHUB_STEP_SUMMARY

      - name: "Загрузка статической сборки Storybook при ошибке"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/ui-docs/storybook-static/
          retention-days: 7