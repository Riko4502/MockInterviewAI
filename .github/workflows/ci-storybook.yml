name: "CI Storybook (ui-docs)"

on:
  workflow_call:
    outputs:
      coverage:
        description: "Результат тестирования историй Storybook"
        value: ${{ jobs.test.outputs.coverage }}

jobs:
  test:
    name: "Сборка и проверка Storybook (apps/ui-docs)"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.storybook_tests.outputs.pct }}
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v7

      - name: "Установка pnpm"
        uses: pnpm/action-setup@v6

      - name: "Установка Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: "Установка зависимостей (frozen-lockfile)"
        run: pnpm install --frozen-lockfile

      - name: "Восстановление / сохранение кэша Turborepo"
        uses: actions/cache@v6
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-storybook-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-storybook-
            ${{ runner.os }}-turbo-

      - name: "Кэширование браузеров Playwright"
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-storybook-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: "Установка Chromium для Playwright"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter=ui-docs exec playwright install --with-deps chromium

      - name: "Установка системных зависимостей Playwright"
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter=ui-docs exec playwright install-deps chromium

      - name: "Сборка зависимостей UI (@packages/utils, @packages/icons, @packages/ui, @packages/tailwind-config)"
        run: pnpm turbo run build --filter=ui-docs^...

      - name: "Проверка типов TypeScript"
        run: pnpm --filter=@packages/icons --filter=@packages/ui --filter=@packages/tailwind-config --filter=ui-docs run typecheck

      - name: "Сборка Storybook (build-storybook)"
        run: pnpm --filter=ui-docs run build-storybook

      - name: "Тестирование историй Storybook (@storybook/test-runner)"
        id: storybook_tests
        run: |
          pnpm --filter=ui-docs run test | tee storybook-test.log
          TOTAL=$(grep -oE '[0-9]+ passed' storybook-test.log | tail -1 | grep -oE '[0-9]+' || echo "")
          if [ -n "$TOTAL" ]; then
            PCT="$TOTAL историй"
          else
            PCT="OK"
          fi
          echo "pct=$PCT" >> $GITHUB_OUTPUT
          echo "### 📚 Отчет Storybook (apps/ui-docs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Сборка Storybook (Rsbuild):** ✅ успешно" >> $GITHUB_STEP_SUMMARY
          echo "- **Тесты историй (Test Runner + Playwright):** \`$PCT\`" >> $GITHUB_STEP_SUMMARY

      - name: "Загрузка статической сборки Storybook при ошибке"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/ui-docs/storybook-static/
          retention-days: 7