name: "Telegram Notification"

on:
  workflow_call:
    inputs:
      realtime_result:
        type: string
        required: false
        default: 'skipped'
      web_result:
        type: string
        required: false
        default: 'skipped'
      api_result:
        type: string
        required: false
        default: 'skipped'
      security_result:
        type: string
        required: false
        default: 'skipped'

jobs:
  notify:
    name: "Отправка в Telegram"
    runs-on: ubuntu-latest
    steps:
      - name: "Формирование отчета CI"
        id: report
        run: |
          RT_RES="${{ inputs.realtime_result }}"
          WEB_RES="${{ inputs.web_result }}"
          API_RES="${{ inputs.api_result }}"
          SEC_RES="${{ inputs.security_result }}"

          if [ "$RT_RES" = "failure" ] || [ "$WEB_RES" = "failure" ] || [ "$API_RES" = "failure" ] || [ "$SEC_RES" = "failure" ]; then
            STATUS_HEADER="❌ *CI: Найдены ошибки*"
          elif [ "$RT_RES" = "cancelled" ] || [ "$WEB_RES" = "cancelled" ] || [ "$API_RES" = "cancelled" ] || [ "$SEC_RES" = "cancelled" ]; then
            STATUS_HEADER="⚠️ *CI: Отменено*"
          else
            STATUS_HEADER="✅ *CI: Проверки успешно пройдены*"
          fi

          format_res() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped) echo "⏭️" ;;
              *) echo "❓" ;;
            esac
          }

          IS_NEW_BRANCH="${{ github.event.created }}"
          EVENT_NAME="${{ github.event_name }}"

          if [ "$IS_NEW_BRANCH" = "true" ]; then
            BRANCH_INFO="🌱 *Создана новая ветка:* \`${{ github.ref_name }}\`"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH_INFO="🔀 *Pull Request:* \`${{ github.head_ref }}\` ➔ \`${{ github.base_ref }}\`"
          else
            BRANCH_INFO="🌿 *Ветка:* \`${{ github.ref_name }}\`"
          fi

          DELIM=$(openssl rand -hex 8)
          echo "message<<$DELIM" >> $GITHUB_OUTPUT
          echo "$STATUS_HEADER" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$BRANCH_INFO" >> $GITHUB_OUTPUT
          echo "📦 *Репозиторий:* [${{ github.repository }}](https://github.com/${{ github.repository }})" >> $GITHUB_OUTPUT
          echo "👤 *Автор:* ${{ github.actor }}" >> $GITHUB_OUTPUT
          echo "💬 *Коммит:* [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "📊 *Результаты проверок:*" >> $GITHUB_OUTPUT
          echo "• Realtime (Go): $(format_res $RT_RES)" >> $GITHUB_OUTPUT
          echo "• Web (Next.js): $(format_res $WEB_RES)" >> $GITHUB_OUTPUT
          echo "• API (Nest.js): $(format_res $API_RES)" >> $GITHUB_OUTPUT
          echo "• Безопасность (TruffleHog): $(format_res $SEC_RES)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "🔗 [Открыть запуск в GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_OUTPUT
          echo "$DELIM" >> $GITHUB_OUTPUT

      - name: "Отправка тихим пушем в Telegram"
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && env.TELEGRAM_THREAD_ID != ''
        uses: appleboy/telegram-action@v1.0.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          disable_notification: true
          format: markdown
          message: ${{ steps.report.outputs.message }}
