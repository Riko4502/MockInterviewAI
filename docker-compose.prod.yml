services:
  redis:
    image: redis:7-alpine
    container_name: mock-interview-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER}/mockinterviewai-api:latest}
    container_name: mock-interview-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_TOKEN_TTL_SECONDS=${LIVEKIT_TOKEN_TTL_SECONDS:-1800}
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy

  realtime:
    image: ${REALTIME_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER}/mockinterviewai-realtime:latest}
    container_name: mock-interview-realtime
    restart: unless-stopped
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - ENVIRONMENT=production
      - LIVEKIT_WEBHOOK_API_KEY=${LIVEKIT_WEBHOOK_API_KEY}
      - LIVEKIT_WEBHOOK_API_SECRET=${LIVEKIT_WEBHOOK_API_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER}/mockinterviewai-web:latest}
    container_name: mock-interview-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_REALTIME_URL=${NEXT_PUBLIC_REALTIME_URL:-http://localhost:8080}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - realtime
      - api

  landing:
    image: ${LANDING_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER}/mockinterviewai-landing:latest}
    container_name: mock-interview-landing
    restart: unless-stopped
    ports:
      - "4321:80"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mock-interview-prometheus
    restart: unless-stopped
    volumes:
      - ./packages/observability/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./packages/observability/infra/prometheus/alerting:/etc/prometheus/alerting:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - realtime
      - redis_exporter
    networks:
      - default
      - monitoring

  redis_exporter:
    image: prom/redis-exporter:v1.61.0
    container_name: mock-interview-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_EXPORTER_CHECK_STREAMS=user:*:notifications
      - REDIS_EXPORTER_CHECK_KEYS=session:*:active
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - monitoring

  grafana:
    image: grafana/grafana:11.1.4
    container_name: mock-interview-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-sentry-datasource
    volumes:
      - ./packages/observability/infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./packages/observability/infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./packages/observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - default
      - monitoring

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
