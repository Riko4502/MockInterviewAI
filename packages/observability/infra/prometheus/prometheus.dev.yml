global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting/*.yml

scrape_configs:
  - job_name: api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - host.docker.internal:3001
        labels:
          service: api

  - job_name: realtime
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: realtime

  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets:
          - redis_exporter:9121
        labels:
          service: redis