# Render Blueprint Specification (render.yaml)
# https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: devsync-db
    databaseName: devsync
    user: devsync_user
    plan: free
    region: frankfurt
    ipAllowList: [] # internal access only

services:
  # -------------------------------------------------------------
  # Redis Cache & Pub/Sub
  # -------------------------------------------------------------
  - type: redis
    name: devsync-redis
    plan: free
    region: frankfurt
    ipAllowList: [] # internal access only
    maxmemoryPolicy: allkeys-lru

  # -------------------------------------------------------------
  # Backend API (NestJS)
  # -------------------------------------------------------------
  - type: web
    name: devsync-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: API_PORT
        value: "3001"
      - key: INTERNAL_SERVICE_KEY
        sync: false # Секрет для X-Internal-Service-Key; должен совпадать с devsync-telegram-bot
      - key: API_DATABASE_URL
        fromDatabase:
          name: devsync-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: devsync-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: devsync-redis
          property: port
      - key: REDIS_PASSWORD
        value: ""
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_HASH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_ISSUER
        value: devsync
      - key: JWT_AUDIENCE
        value: api
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: ALLOWED_ORIGINS
        sync: false # Set to your frontend domain (e.g. https://devsync-web.onrender.com)
      - key: GITHUB_CLIENT_ID
        sync: false # GitHub OAuth App client ID
      - key: GITHUB_CLIENT_SECRET
        sync: false # Set in Render; never commit the client secret
      - key: GITHUB_CALLBACK_URL
        sync: false # https://<api-domain>/api/v1/auth/github/callback
      - key: FRONTEND_URL
        sync: false # https://<web-domain>, used for the post-login redirect
      - key: S3_ENDPOINT
        sync: false # Cloudflare R2 / AWS S3 endpoint
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: devsync-storage
      - key: S3_PUBLIC_URL
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: LIVEKIT_URL
        sync: false # e.g. wss://devsync-livekit.onrender.com или wss://your-project.livekit.cloud
      - key: LIVEKIT_API_KEY
        fromService:
          type: web
          name: devsync-livekit
          envVarKey: LIVEKIT_API_KEY
      - key: LIVEKIT_API_SECRET
        fromService:
          type: web
          name: devsync-livekit
          envVarKey: LIVEKIT_API_SECRET

  # -------------------------------------------------------------
  # Realtime WebSocket & SSE Server (Go)
  # -------------------------------------------------------------
  - type: web
    name: devsync-realtime
    runtime: docker
    dockerfilePath: ./apps/realtime/Dockerfile
    dockerContext: ./apps/realtime
    plan: free
    region: frankfurt
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8080"
      - key: REDIS_HOST
        fromService:
          type: redis
          name: devsync-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: devsync-redis
          property: port
      - key: REDIS_PASSWORD
        value: ""
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: devsync-api
          envVarKey: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: devsync-api
          envVarKey: JWT_REFRESH_SECRET
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LIVEKIT_WEBHOOK_API_KEY
        fromService:
          type: web
          name: devsync-livekit
          envVarKey: LIVEKIT_API_KEY
      - key: LIVEKIT_WEBHOOK_API_SECRET
        fromService:
          type: web
          name: devsync-livekit
          envVarKey: LIVEKIT_API_SECRET

  # -------------------------------------------------------------
  # LiveKit SFU (WebRTC Audio/Video/Screenshare)
  # -------------------------------------------------------------
  - type: web
    name: devsync-livekit
    runtime: docker
    dockerfilePath: ./apps/livekit/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "7880"
      - key: LIVEKIT_CONFIG
        value: |
          port: 7880
          bind_addresses:
            - ""
          rtc:
            use_external_ip: true
      - key: LIVEKIT_API_KEY
        value: devsync_key
      - key: LIVEKIT_API_SECRET
        generateValue: true

  # -------------------------------------------------------------
  # Telegram Bot
  # -------------------------------------------------------------
  - type: web
    name: devsync-telegram-bot
    runtime: docker
    dockerfilePath: ./apps/telegram-bot/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_USERNAME
        value: MockInterviewBot
      - key: TELEGRAM_BOT_TOKEN
        sync: false # От @BotFather (get-token), никогда не коммитить
      - key: API_INTERNAL_URL
        sync: false # https://devsync-api.onrender.com/api/v1
      - key: INTERNAL_SERVICE_KEY
        fromService:
          type: web
          name: devsync-api
          envVarKey: INTERNAL_SERVICE_KEY
      - key: WEB_APP_URL
        sync: false # https://devsync-web.onrender.com (ссылки join на сессии)
      - key: TELEGRAM_WEBHOOK_URL
        sync: false # https://devsync-telegram-bot.onrender.com/telegram/webhook
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false # Произвольная строка, проверяется в X-Telegram-Bot-Api-Secret-Token
      # TELEGRAM_WEBHOOK_PORT не задаём: в проде подхватывается $PORT (config.ts)

  # -------------------------------------------------------------
  # Code Runner (Go) — sandboxed code execution service
  # -------------------------------------------------------------
  - type: web
    name: devsync-code-runner
    runtime: docker
    dockerfilePath: ./apps/code-runner/Dockerfile
    dockerContext: ./apps/code-runner
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8090"
      - key: CODE_RUNNER_AUTH_TOKEN
        generateValue: true
      - key: JUDGE0_URL
        sync: false # e.g. http://judge0-server:2358
      - key: JUDGE0_AUTH_TOKEN
        sync: false

  # -------------------------------------------------------------
  # Web Frontend (Next.js)
  # -------------------------------------------------------------
  - type: web
    name: devsync-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_APP_URL
        sync: false # e.g. https://devsync-web.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # e.g. https://devsync-landing.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false # e.g. https://devsync-api.onrender.com
      - key: NEXT_PUBLIC_REALTIME_URL
        sync: false # e.g. wss://devsync-realtime.onrender.com
      - key: NEXT_PUBLIC_API_PROXY
        value: "true"

  # -------------------------------------------------------------
  # Landing Page (Nginx Static Export)
  # -------------------------------------------------------------
  - type: web
    name: devsync-landing
    runtime: docker
    dockerfilePath: ./apps/landing/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "8080"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # e.g. https://devsync-landing.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false # e.g. https://devsync-web-x081.onrender.com
      - key: NEXT_PUBLIC_AUTH_URL
        sync: false # e.g. https://devsync-web-x081.onrender.com/login
      - key: NEXT_PUBLIC_REGISTER_URL
        sync: false # e.g. https://devsync-web-x081.onrender.com/register
      - key: NEXT_PUBLIC_GITHUB_URL
        value: https://github.com/Riko4502/MockInterviewAI

  # -------------------------------------------------------------
  # UI Docs / Storybook (Nginx Static Export)
  # -------------------------------------------------------------
  - type: web
    name: devsync-ui-docs
    runtime: docker
    dockerfilePath: ./apps/ui-docs/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "8080"

  # -------------------------------------------------------------
  # Grafana (Metrics & Monitoring Dashboards)
  # -------------------------------------------------------------
  - type: web
    name: devsync-grafana
    runtime: image
    image:
      url: grafana/grafana:latest
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: GF_SERVER_HTTP_PORT
        value: "3000"
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        sync: false # Задайте надежный пароль администратора Grafana
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
