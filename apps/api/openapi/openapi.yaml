          description: Номер страницы (по умолчанию 1)
          schema:
            type: number
        - name: status
          required: false
          in: query
          description: Фильтр по статусу заявки
          schema:
            enum:
              - PENDING
              - ACCEPTED
              - REJECTED
              - CANCELLED
              - EXPIRED
            type: string
      responses:
        "200":
          description: Пагинированный список исходящих заявок
      security: *a14
      summary: Получить список исходящих заявок текущего пользователя
      tags: *a15
  /api/v1/matchmaking/requests/{id}/accept:
    post:
      operationId: MatchmakingController_accept
      parameters:
        - name: id
          required: true
          in: path
          description: ID заявки
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Заявка успешно принята, контакты открыты
        "400":
          description: Заявка не в статусе ожидания или срок её действия истёк
        "403":
          description: Недостаточно прав для принятия чужой заявки
        "404":
          description: Заявка не найдена
      security: *a14
      summary: Принять входящую заявку на собеседование
      tags: *a15
  /api/v1/matchmaking/requests/{id}/reject:
    post:
      operationId: MatchmakingController_reject
      parameters:
        - name: id
          required: true
          in: path
          description: ID заявки
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectMatchRequestDto"
      responses:
        "200":
          description: Заявка успешно отклонена
        "400":
          description: Заявка не в статусе ожидания
        "403":
          description: Недостаточно прав для отклонения чужой заявки
        "404":
          description: Заявка не найдена
      security: *a14
      summary: Отклонить входящую заявку на собеседование
      tags: *a15
  /api/v1/matchmaking/requests/{id}/cancel:
    post:
      operationId: MatchmakingController_cancel
      parameters:
        - name: id
          required: true
          in: path
          description: ID заявки
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Заявка успешно отменена
        "400":
          description: Заявка не в статусе ожидания
        "403":
          description: Недостаточно прав для отмены чужой заявки
        "404":
          description: Заявка не найдена
      security: *a14
      summary: Отменить свою исходящую заявку на собеседование
      tags: *a15
info:
  title: Mock Interview AI API
  description: |-
    Auth API: register, login, logout.

    Refresh token передаётся только через HttpOnly cookie
    (HttpOnly; SameSite=Lax; Path=/api/v1/auth; Max-Age=JWT_REFRESH_EXPIRATION)
    и не возвращается в JSON response.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3001
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        displayName:
          nullable: true
          type: string
        username:
          nullable: true
          type: string
        avatarUrl:
          nullable: true
          type: string
        telegramUsername:
          nullable: true
          type: string
        gitUrl:
          nullable: true
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        role:
          type: string
        permissions:
          type: string
        theme:
          type: string
          enum:
            - light
            - dark
            - system
        locale:
          type: string
          enum:
            - ru
            - en
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - displayName
        - username
        - avatarUrl
        - telegramUsername
        - gitUrl
        - createdAt
        - email
        - role
        - permissions
        - theme
        - locale
        - updatedAt
    UpdateProfileDto:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        username:
          type: string
          pattern: ^[a-zA-Z0-9_-]{3,30}$
        avatarUrl:
          nullable: true
