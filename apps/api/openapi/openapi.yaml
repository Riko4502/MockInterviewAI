        "204":
          description: Анкета успешно удалена
        "403":
          description: Недостаточно прав
        "404":
          description: Анкета не найдена
      security: *a14
      summary: Удалить анкету
      tags: *a15
  /api/v1/showcase/{id}/status:
    patch:
      operationId: ShowcaseController_updateStatus
      parameters:
        - name: id
          required: true
          in: path
          description: ID карточки витрины
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShowcaseCardStatusDto"
      responses:
        "200":
          description: Статус успешно изменен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseCardResponseDto"
        "400":
          description: Превышен лимит 5 активных карточек или анкета просрочена
        "403":
          description: Недостаточно прав
        "404":
          description: Анкета не найдена
      security: *a14
      summary: Переключить статус анкеты ACTIVE <-> INACTIVE
      tags: *a15
  /api/v1/showcase/{id}/bump:
    post:
      operationId: ShowcaseController_bump
      parameters:
        - name: id
          required: true
          in: path
          description: ID карточки витрины
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Анкета поднята в топ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseCardResponseDto"
        "400":
          description: Не прошёл кулдаун 24 часа или анкета не активна
        "403":
          description: Недостаточно прав
        "404":
          description: Анкета не найдена
      security: *a14
      summary: Поднять анкету в топ каталога (раз в 24 часа)
      tags: *a15
  /api/v1/showcase/{id}/renew:
    post:
      operationId: ShowcaseController_renew
      parameters:
        - name: id
          required: true
          in: path
          description: ID карточки витрины
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Анкета продлена на 15 дней
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseCardResponseDto"
        "400":
          description: Анкета не в статусе EXPIRED или достигнут лимит 5 анкет
        "403":
          description: Недостаточно прав
        "404":
          description: Анкета не найдена
      security: *a14
      summary: Продлить истекшую анкету (EXPIRED -> ACTIVE)
      tags: *a15
  /api/v1/matchmaking/requests/unread-count:
    get:
      operationId: MatchmakingController_getUnreadCount
      parameters: []
      responses:
        "200":
          description: Количество непрочитанных заявок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadMatchRequestsCountDto"
      security: &a16
        - bearer: []
      summary: Получить количество входящих заявок в ожидании ответа (статус PENDING)
      tags: &a17
        - Matchmaking
  /api/v1/matchmaking/requests:
    post:
      operationId: MatchmakingController_create
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchRequestDto"
      responses:
        "201":
          description: Заявка успешно отправлена (или согласована при авто-матче)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRequestResponseDto"
        "400":
          description: Не заполнен профиль, попытка отклика на себя, исчерпан лимит
            входящих на карточке или действует кулдаун
        "403":
          description: Указанная карточка отправителя не принадлежит пользователю
        "404":
          description: Целевая карточка не найдена или не активна
        "429":
          description: Превышен лимит активных исходящих заявок (максимум 5)
      security: *a16
      summary: Отправить заявку (отклик) на карточку собеседования
      tags: *a17
  /api/v1/matchmaking/requests/incoming:
    get:
      operationId: MatchmakingController_findIncoming
      parameters:
        - name: limit
          required: false
          in: query
          description: Размер страницы (по умолчанию 20, максимум 50)
          schema:
            type: number
        - name: page
          required: false
          in: query
          description: Номер страницы (по умолчанию 1)
          schema:
            type: number
        - name: status
          required: false
          in: query
          description: Фильтр по статусу заявки
          schema:
            enum:
              - PENDING
              - ACCEPTED
              - REJECTED
              - CANCELLED
              - EXPIRED
            type: string
      responses:
        "200":
          description: Пагинированный список входящих заявок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMatchRequestsDto"
      security: *a16
      summary: Получить список входящих заявок текущего пользователя
      tags: *a17
  /api/v1/matchmaking/requests/outgoing:
    get:
      operationId: MatchmakingController_findOutgoing
      parameters:
        - name: limit
          required: false
          in: query
          description: Размер страницы (по умолчанию 20, максимум 50)
          schema:
            type: number
        - name: page
          required: false
          in: query
          description: Номер страницы (по умолчанию 1)
          schema:
            type: number
        - name: status
          required: false
          in: query
          description: Фильтр по статусу заявки
          schema:
            enum:
              - PENDING
              - ACCEPTED
              - REJECTED
              - CANCELLED
              - EXPIRED
            type: string
      responses:
        "200":
          description: Пагинированный список исходящих заявок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMatchRequestsDto"
      security: *a16
      summary: Получить список исходящих заявок текущего пользователя
      tags: *a17
  /api/v1/matchmaking/requests/{id}/accept:
    post:
      operationId: MatchmakingController_accept
      parameters:
        - name: id
          required: true
          in: path
          description: ID заявки
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Заявка успешно принята, контакты открыты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRequestResponseDto"
        "400":
          description: Заявка не в статусе ожидания или срок её действия истёк
        "403":
          description: Недостаточно прав для принятия чужой заявки
        "404":
          description: Заявка не найдена
      security: *a16
      summary: Принять входящую заявку на собеседование
      tags: *a17
  /api/v1/matchmaking/requests/{id}/reject:
    post:
      operationId: MatchmakingController_reject
      parameters:
        - name: id
          required: true
          in: path
          description: ID заявки
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectMatchRequestDto"
      responses:
        "200":
          description: Заявка успешно отклонена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRequestResponseDto"
        "400":
          description: Заявка не в статусе ожидания
        "403":
          description: Недостаточно прав для отклонения чужой заявки
        "404":
          description: Заявка не найдена
      security: *a16
      summary: Отклонить входящую заявку на собеседование
      tags: *a17
  /api/v1/matchmaking/requests/{id}/cancel:
    post:
      operationId: MatchmakingController_cancel
      parameters:
        - name: id
          required: true
          in: path
          description: ID заявки
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Заявка успешно отменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRequestResponseDto"
        "400":
          description: Заявка не в статусе ожидания
        "403":
          description: Недостаточно прав для отмены чужой заявки
        "404":
          description: Заявка не найдена
      security: *a16
      summary: Отменить свою исходящую заявку на собеседование
      tags: *a17
info:
  title: Mock Interview AI API
  description: |-
    Auth API: register, login, logout.

    Refresh token передаётся только через HttpOnly cookie
    (HttpOnly; SameSite=Lax; Path=/api/v1/auth; Max-Age=JWT_REFRESH_EXPIRATION)
    и не возвращается в JSON response.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3001
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    NotificationsListDto:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              userId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              category:
                type: string
                enum:
                  - SYSTEM
                  - INTERVIEW
                  - MESSAGE
              type:
                type: string
                minLength: 1
              payload: {}
              title:
                type: string
              message:
                type: string
              actionUrl:
                nullable: true
                type: string
              readAt:
                nullable: true
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              deletedAt:
                nullable: true
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              createdAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              updatedAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            required:
              - id
              - userId
              - category
              - type
              - payload
              - title
              - message
              - actionUrl
              - readAt
              - deletedAt
              - createdAt
              - updatedAt
        page:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        totalPages:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - items
        - page
        - limit
        - total
        - totalPages
    UnreadNotificationsCountDto:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - count
    NotificationActionResponseDto:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        displayName:
          nullable: true
          type: string
        username:
          nullable: true
          type: string
        avatarUrl:
          nullable: true
          type: string
        telegramUsername:
          nullable: true
          type: string
        gitUrl:
          nullable: true
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        role:
          type: string
        permissions:
          type: string
        theme:
          type: string
          enum:
            - light
            - dark
            - system
        locale:
          type: string
          enum:
            - ru
            - en
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - displayName
        - username
        - avatarUrl
        - telegramUsername
        - gitUrl
        - createdAt
        - email
        - role
        - permissions
        - theme
        - locale
        - updatedAt
    UpdateProfileDto:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        username:
          type: string
          pattern: ^[a-zA-Z0-9_-]{3,30}$
        avatarUrl:
          nullable: true
          type: string
          format: uri
        telegramUsername:
          nullable: true
          type: string
          pattern: ^@?[a-zA-Z0-9_]{5,32}$
        gitUrl:
          nullable: true
          type: string
          pattern: ^https?:\/\/(www\.)?(github|gitlab)\.com\/[a-zA-Z0-9_.-]+\/?$
        theme:
          type: string
          enum:
            - light
            - dark
            - system
        locale:
          type: string
          enum:
            - ru
            - en
        timezone:
          type: string
    DeviceSettingsDto:
      type: object
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 128
        deviceName:
          nullable: true
          type: string
          maxLength: 128
        audioVolume:
          default: 80
          type: integer
          minimum: 0
          maximum: 100
        speechVolume:
          default: 80
          type: integer
          minimum: 0
          maximum: 100
        micGain:
          default: 100
          type: integer
          minimum: 0
          maximum: 100
        preferredAudioInputLabel:
          nullable: true
          type: string
        preferredAudioOutputLabel:
          nullable: true
          type: string
        preferredVideoInputLabel:
          nullable: true
          type: string
        isPersisted:
          default: false
          type: boolean
      required:
        - clientId
    UpdateDeviceSettingsDto:
      type: object
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 128
        deviceName:
          type: string
          maxLength: 128
        audioVolume:
          type: integer
          minimum: 0
          maximum: 100
        speechVolume:
          type: integer
          minimum: 0
          maximum: 100
        micGain:
          type: integer
          minimum: 0
          maximum: 100
        preferredAudioInputLabel:
          nullable: true
          type: string
        preferredAudioOutputLabel:
          nullable: true
          type: string
        preferredVideoInputLabel:
          nullable: true
          type: string
      required:
        - clientId
    AvatarUploadResponseDto:
      type: object
      properties:
        avatarUrl:
          type: string
      required:
        - avatarUrl
    AvatarDeleteResponseDto:
      type: object
      properties:
        avatarUrl:
          type: string
          nullable: true
      required:
        - avatarUrl
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: Операция выполнена успешно
      required:
        - message
    RestoreProfileResponseDto:
      type: object
      properties:
        message:
          type: string
        profile:
          $ref: "#/components/schemas/UserProfileDto"
      required:
        - message
        - profile
    PublicUserProfileDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        displayName:
          nullable: true
          type: string
        username:
          nullable: true
          type: string
        avatarUrl:
          nullable: true
          type: string
        telegramUsername:
          nullable: true
          type: string
        gitUrl:
          nullable: true
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - displayName
        - username
        - avatarUrl
        - telegramUsername
        - gitUrl
        - createdAt
    AccessTokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
      required:
        - accessToken
    ValidationErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        message:
          type: object
          additionalProperties:
            type: string
          example:
            email: Некорректный email
          description: "Карта ошибок `{ field: message }`."
      required:
        - statusCode
        - message
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 401
        message:
          type: string
          example: Invalid credentials
        error:
          type: string
      required:
        - statusCode
        - message
    TelegramAuthResponseDto:
      oneOf:
        - type: object
          properties:
            status:
              type: string
              enum:
                - AUTHENTICATED
              example: AUTHENTICATED
            accessToken:
              type: string
              description: JWT access token
          required:
            - status
            - accessToken
        - type: object
          properties:
            status:
              type: string
              enum:
                - NEED_EMAIL
              example: NEED_EMAIL
            onboardingToken:
              type: string
              description: Одноразовый токен онбординга для завершения регистрации
          required:
            - status
            - onboardingToken
    OAuthProvidersResponseDto:
      type: object
      properties:
        github:
          type: boolean
      required:
        - github
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        passwordConfirmation:
          type: string
          minLength: 1
      required:
        - email
        - password
        - passwordConfirmation
    LoginDto:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
        newPasswordConfirmation:
          type: string
          minLength: 1
      required:
        - currentPassword
        - newPassword
        - newPasswordConfirmation
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          format: email
