openapi: 3.0.0
paths:
  /api/v1/health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        "200":
          description: Приложение и PostgreSQL доступны.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponseDto"
        "503":
          description: PostgreSQL недоступен. Детали ошибки только в логах (§56).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponseDto"
      summary: Проверка состояния приложения (§56)
      tags:
        - health
  /api/v1/profile/me:
    get:
      operationId: ProfileController_getMyProfile
      parameters: []
      responses:
        "200":
          description: Профиль текущего пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileDto"
        "401":
          description: Не авторизован
      security: &a1
        - bearer: []
      summary: Получить профиль текущего авторизованного пользователя
      tags: &a2
        - Profile
    patch:
      operationId: ProfileController_updateMyProfile
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileDto"
      responses:
        "200":
          description: Обновленный профиль пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileDto"
        "400":
          description: Ошибка валидации входных данных
        "401":
          description: Не авторизован
      security: *a1
      summary: Обновить профиль текущего пользователя
      tags: *a2
    delete:
      operationId: ProfileController_deleteMyProfile
      parameters: []
      responses:
        "200":
          description: Аккаунт успешно деактивирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "401":
          description: Не авторизован
      security: *a1
      summary: Деактивировать аккаунт текущего пользователя
      tags: *a2
  /api/v1/profile/device-settings:
    get:
      operationId: ProfileController_getDeviceSettings
      parameters:
        - name: clientId
          required: true
          in: query
          description: Уникальный ID клиентского устройства (1-128 символов)
          schema:
            type: string
      responses:
        "200":
          description: Настройки аудио, речи и устройств
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSettingsDto"
        "400":
          description: Некорректный clientId
        "401":
          description: Не авторизован
      security: *a1
      summary: Получить настройки медиа и устройств для клиентского устройства
      tags: *a2
    put:
      operationId: ProfileController_updateDeviceSettings
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceSettingsDto"
      responses:
        "200":
          description: Обновленные настройки аудио, речи и устройств
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSettingsDto"
        "400":
          description: Ошибка валидации входных данных
        "401":
          description: Не авторизован
      security: *a1
      summary: Сохранить настройки медиа и устройств для клиентского устройства
      tags: *a2
  /api/v1/profile/avatar:
    post:
      operationId: ProfileController_uploadAvatar
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Аватар успешно загружен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResponseDto"
        "400":
          description: Некорректный файл аватара
        "401":
          description: Не авторизован
      security: *a1
      summary: Загрузить аватар профиля
      tags: *a2
    delete:
      operationId: ProfileController_deleteAvatar
      parameters: []
      responses:
        "200":
          description: Аватар успешно удален
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarDeleteResponseDto"
        "401":
          description: Не авторизован
      security: *a1
      summary: Удалить аватар профиля
      tags: *a2
  /api/v1/profile/restore:
    post:
      operationId: ProfileController_restoreMyProfile
      parameters: []
      responses:
        "201":
          description: Аккаунт успешно восстановлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreProfileResponseDto"
        "401":
          description: Не авторизован
      security: *a1
      summary: Восстановить деактивированный аккаунт
      tags: *a2
  /api/v1/users/{idOrUsername}:
    get:
      operationId: UsersController_getPublicProfile
      parameters:
        - name: idOrUsername
          required: true
          in: path
          description: UUID пользователя или username
          schema:
            type: string
      responses:
        "200":
          description: Публичный профиль пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserProfileDto"
        "401":
          description: Не авторизован
        "404":
          description: Пользователь не найден
      security:
        - bearer: []
      summary: Получить публичный профиль пользователя по UUID или username
      tags:
        - Users
  /api/v1/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        "201":
          description: "Успешная регистрация. Set-Cookie: refresh_token={JWT}; HttpOnly;
            SameSite=Lax; Path=/api/v1/auth; Max-Age=JWT_REFRESH_EXPIRATION
            (§25–28 SPEC.md). Refresh token не возвращается в JSON response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponseDto"
        "400":
          description: Ошибка валидации DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponseDto"
        "409":
          description: Email уже зарегистрирован.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Регистрация нового пользователя (§4)
      tags: &a3
        - auth
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: "Успешный вход. Set-Cookie: refresh_token={JWT}; HttpOnly;
            SameSite=Lax; Path=/api/v1/auth; Max-Age=JWT_REFRESH_EXPIRATION
            (§25–28 SPEC.md). Refresh token не возвращается в JSON response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponseDto"
        "400":
          description: Ошибка валидации DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponseDto"
        "401":
          description: Неверные учётные данные (единый ответ без деталей, §59).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Вход пользователя (§58)
      tags: *a3
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        "204":
          description: "Успешный выход. Set-Cookie: refresh_token=; Expires=в прошлом —
            cookie сброшена (§60)."
        "401":
          description: Refresh cookie отсутствует/невалиден. Cookie при этом очищается
            всегда (§60).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Redis недоступен. Cookie НЕ сбрасывается, чтобы не потерять сессию
            (§60).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
        - bearer: []
      summary: Выход пользователя (§60)
      tags: *a3
  /api/v1/auth/logout-all:
    post:
      operationId: AuthController_logoutAll
      parameters: []
      responses:
        "204":
          description: "Все сессии пользователя отозваны. Set-Cookie: refresh_token=;
            Expires=в прошлом — cookie сброшена (§66)."
        "500":
          description: Redis недоступен — отзыв сессий не выполнен. Cookie НЕ сбрасывается
            (§66).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
        - bearer: []
      summary: Отзыв всех сессий пользователя (§66)
      tags: *a3
  /api/v1/auth/change-password:
    post:
      operationId: AuthController_changePassword
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordDto"
      responses:
        "204":
          description: "Пароль обновлён, все сессии отозваны. Set-Cookie: refresh_token=;
            Expires=в прошлом — cookie сброшена (§67)."
        "400":
          description: Ошибка валидации DTO или новый пароль совпадает с текущим.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponseDto"
        "401":
          description: Неверный текущий пароль (§67).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Пользователь не найден (§67).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: Состояние пользователя изменилось параллельно — повторите запрос
            (§67).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Redis недоступен — сессии не отозваны. Cookie НЕ сбрасывается (§67).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
        - bearer: []
      summary: Смена пароля (§67)
      tags: *a3
  /api/v1/auth/forgot-password:
    post:
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDto"
      responses:
        "200":
          description: Запрос на сброс пароля принят (единый ответ для защиты от
            перечисления).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "400":
          description: Ошибка валидации DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponseDto"
      summary: Запрос ссылки на сброс пароля (Forgot Password)
      tags: *a3
  /api/v1/auth/reset-password:
    post:
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDto"
      responses:
        "200":
          description: Пароль успешно изменён, все сессии отозваны.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "400":
          description: Недействительный или истекший токен / ошибка валидации.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponseDto"
                  - $ref: "#/components/schemas/ErrorResponseDto"
      summary: Установка нового пароля по токену сброса (Reset Password)
      tags: *a3
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      responses:
        "200":
          description: "Успешное обновление. Set-Cookie: refresh_token={JWT}; HttpOnly;
            SameSite=Lax; Path=/api/v1/auth; Max-Age=JWT_REFRESH_EXPIRATION
            (§25–28 SPEC.md). Refresh token не возвращается в JSON response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponseDto"
        "401":
          description: Refresh cookie отсутствует/невалиден/replay. Cookie при этом
            очищается always (§65).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Redis недоступен. Cookie НЕ сбрасывается, чтобы не потерять сессию
            (§60).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Обновление токенов — refresh token rotation (§65)
      tags: *a3
  /api/v1/auth/oauth/providers:
    get:
      operationId: AuthController_oauthProviders
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthProvidersResponseDto"
      summary: Get configured OAuth providers
      tags: *a3
  /api/v1/auth/github:
    get:
      operationId: AuthController_github
      parameters: []
      responses:
        "302":
          description: Redirect to GitHub
      summary: Start GitHub OAuth login
      tags: *a3
  /api/v1/auth/github/callback:
    get:
      operationId: AuthController_githubCallback
      parameters:
        - name: state
          required: false
          in: query
          schema:
            type: string
        - name: code
          required: false
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Refresh cookie and redirect to dashboard
      summary: Complete GitHub OAuth login
      tags: *a3
  /api/v1/auth/telegram:
    post:
      operationId: AuthController_telegramAuth
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramAuthDto"
      responses:
        "200":
          description: "Успешный вход (AUTHENTICATED) или необходимость ввода email
            (NEED_EMAIL). Set-Cookie: refresh_token={JWT}; HttpOnly;
            SameSite=Lax; Path=/api/v1/auth; Max-Age=JWT_REFRESH_EXPIRATION
            (§25–28 SPEC.md). Refresh token не возвращается в JSON response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramAuthResponseDto"
        "400":
          description: Ошибка валидации DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponseDto"
        "401":
          description: Недействительная подпись Telegram, истекший auth_date или повторный
            запрос.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Вход через Telegram Widget
      tags: *a3
  /api/v1/auth/telegram/complete:
    post:
      operationId: AuthController_telegramComplete
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramCompleteDto"
      responses:
        "201":
          description: "Успешное завершение онбординга и создание аккаунта. Set-Cookie:
            refresh_token={JWT}; HttpOnly; SameSite=Lax; Path=/api/v1/auth;
            Max-Age=JWT_REFRESH_EXPIRATION (§25–28 SPEC.md). Refresh token не
            возвращается в JSON response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponseDto"
        "400":
          description: Недействительный или истекший onboardingToken / ошибка валидации.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponseDto"
                  - $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: Email уже зарегистрирован.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Завершение онбординга Telegram с указанием email
      tags: *a3
  /api/v1/auth/telegram/link:
    post:
      operationId: AuthController_telegramLink
      parameters: []
      requestBody:
        required: true
        description: Тело запроса, валидируется соответствующей zod-схемой.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLinkDto"
      responses:
        "200":
          description: Telegram аккаунт успешно привязан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponseDto"
        "400":
          description: Ошибка валидации DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponseDto"
        "401":
          description: Недействительная подпись Telegram или неавторизованный запрос.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: Telegram аккаунт уже привязан к другому пользователю.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
        - bearer: []
      summary: Привязка Telegram аккаунта
      tags: *a3
  /api/v1/notifications:
    get:
      operationId: NotificationsController_getNotifications
      parameters:
        - name: page
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number. Minimum value is 1.
        - name: limit
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: "Number of notifications per page. Allowed range: 1–100."
        - name: category
          required: false
          in: query
          description: Notification category. Omit to include all categories.
          schema:
            enum:
              - SYSTEM
              - INTERVIEW
              - MESSAGE
            type: string
      responses:
        "200":
          description: Paginated notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsListDto"
        "400":
          description: Invalid pagination or category parameters
      security: &a4
        - bearer: []
      summary: Get user notifications
      tags: &a5
        - Notifications
  /api/v1/notifications/unread-count:
    get:
      operationId: NotificationsController_getUnreadCount
      parameters: []
      responses:
        "200":
          description: Unread notifications count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationsCountDto"
      security: *a4
      summary: Get unread notifications count
      tags: *a5
  /api/v1/notifications/read-all:
    post:
      operationId: NotificationsController_markAllAsRead
      parameters: []
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationActionResponseDto"
      security: *a4
      summary: Mark all notifications as read
      tags: *a5
  /api/v1/notifications/{id}/read:
    patch:
      operationId: NotificationsController_markAsRead
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationActionResponseDto"
        "404":
          description: Notification not found
      security: *a4
      summary: Mark notification as read
      tags: *a5
  /api/v1/notifications/{id}:
    delete:
      operationId: NotificationsController_markAsDeleted
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Notification deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationActionResponseDto"
        "404":
          description: Notification not found
      security: *a4
      summary: Delete notification
      tags: *a5
  /api/v1/admin/users:
    get:
      operationId: AdminUsersController_getUsersList
      parameters:
        - name: sortOrder
          required: false
          in: query
          description: Направление сортировки (по умолчанию desc)
          schema:
            enum:
              - asc
              - desc
            type: string
        - name: sortBy
          required: false
          in: query
          description: Поле сортировки (по умолчанию createdAt)
          schema:
            enum:
              - createdAt
              - email
              - username
              - displayName
              - role
              - updatedAt
            type: string
        - name: isDeleted
          required: false
          in: query
          description: Фильтр по статусу удаления (soft-deleted)
          schema:
            type: boolean
        - name: isActive
          required: false
          in: query
          description: Фильтр по статусу активности
          schema:
            type: boolean
        - name: role
          required: false
          in: query
          description: Фильтр по роли пользователя (например, USER или ADMIN)
          schema:
            type: string
        - name: search
          required: false
          in: query
          description: Поиск по email, username или displayName
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Количество записей на страницу (по умолчанию 20, макс. 100)
          schema:
            type: number
        - name: page
          required: false
          in: query
          description: Номер страницы (по умолчанию 1)
          schema:
            type: number
      responses:
        "200":
          description: Пагинированный список пользователей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsersAdminResponseDto"
        "401":
