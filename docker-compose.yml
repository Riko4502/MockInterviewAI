services:
  postgres:
    image: postgres:16-alpine
    container_name: mock-interview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mock_interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mock_interview}
      POSTGRES_DB: ${POSTGRES_DB:-mock_interview}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mock_interview} -d ${POSTGRES_DB:-mock_interview}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mock-interview-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mock-interview-redis}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: mock-interview-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: mock-interview-livekit
    restart: unless-stopped
    command:
      - --config-body
      - |
        port: 7880
        bind_addresses:
          - ""
        rtc:
          tcp_port: 7881
          port_range_start: ${LIVEKIT_UDP_PORT_START:-60000}
          port_range_end: ${LIVEKIT_UDP_PORT_END:-60018}
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-dev-local-secret-change-me-0123456789}
        webhook:
          api_key: ${LIVEKIT_WEBHOOK_API_KEY:-${LIVEKIT_API_KEY:-devkey}}
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-http://realtime:8080/webhooks/livekit}
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"       # сигнальный WS/HTTP
      - "${LIVEKIT_TCP_PORT:-7881}:7881"   # TCP media (SRTP/TCP)
      # UDP media (WebRTC); вне исключённых Windows UDP-портов 50000-50478.
      # Проверка на машине: netsh interface ipv4 show excludedportrange protocol=udp;
      # при конфликте диапазон переопределяется через LIVEKIT_UDP_PORT_START/END.
      - "${LIVEKIT_UDP_PORT_START:-60000}-${LIVEKIT_UDP_PORT_END:-60018}:${LIVEKIT_UDP_PORT_START:-60000}-${LIVEKIT_UDP_PORT_END:-60018}/udp"

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: mock-interview-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/$${S3_BUCKET_NAME:-mock-interview-storage};
      /usr/bin/mc anonymous set download local/$${S3_BUCKET_NAME:-mock-interview-storage}/avatars;
      /usr/bin/mc anonymous set download local/$${S3_BUCKET_NAME:-mock-interview-storage}/public;
      exit 0;
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-mock-interview-storage}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mock-interview-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mock_interview}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mock_interview_pass}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  realtime:
    build:
      context: ./apps/realtime
      dockerfile: Dockerfile
    container_name: mock-interview-realtime
    profiles: ["realtime", "all"]
    restart: unless-stopped
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_ENABLED: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_WEBHOOK_API_KEY:?LIVEKIT_WEBHOOK_API_KEY is required}
      LIVEKIT_WEBHOOK_API_SECRET: ${LIVEKIT_WEBHOOK_API_SECRET:?LIVEKIT_WEBHOOK_API_SECRET is required}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "${REALTIME_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy

  # --- Code Runner: выполнение пользовательского кода через Judge0 CE ---
  # Профиль поднимает всё разом — code-runner и четыре контейнера Judge0
  # (API-сервер, пул воркеров, своя Postgres под submissions, свой Redis под
  # очередь resque):
  #
  #   docker compose --env-file .env --profile code-runner up -d --build
  #
  # Отдельным профилем, а не вместе с базовой инфраструктурой, потому что
  # judge0-server и judge0-workers требуют privileged: true — isolate внутри
  # контейнера создаёт namespaces и cgroups.
  #
  # Хост должен быть на cgroup v1 (проверка: stat -fc %T /sys/fs/cgroup → tmpfs).
  # На cgroup v2 контейнеры поднимутся, но запуски кода будут падать с
  # "Failed to create control group".
  code-runner:
    build:
      context: ./apps/code-runner
      dockerfile: Dockerfile
    container_name: mock-interview-code-runner
    profiles: ["code-runner", "all"]
    restart: unless-stopped
    environment:
      CODE_RUNNER_PORT: 8090
      CODE_RUNNER_HOST: 0.0.0.0
      ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Общий секрет для вызовов из apps/api и apps/realtime (X-Internal-Token).
      # Пустое значение отключает проверку и допустимо только в dev.
      CODE_RUNNER_AUTH_TOKEN: ${CODE_RUNNER_AUTH_TOKEN:-}
      # Переопределяется, если нужно ходить во внешний Judge0 вместо локального.
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0-server:2358}
      JUDGE0_AUTH_HEADER: X-Auth-Token
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
    ports:
      - "${CODE_RUNNER_PORT:-8090}:8090"
    depends_on:
      judge0-server:
        condition: service_started

  judge0-db:
    image: postgres:16-alpine
    container_name: mock-interview-judge0-db
    profiles: ["code-runner", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${JUDGE0_POSTGRES_USER:-judge0}
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0}
      POSTGRES_DB: ${JUDGE0_POSTGRES_DB:-judge0}
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JUDGE0_POSTGRES_USER:-judge0} -d ${JUDGE0_POSTGRES_DB:-judge0}"]
      interval: 5s
      timeout: 5s
      retries: 5

  judge0-redis:
    image: redis:7-alpine
    container_name: mock-interview-judge0-redis
    profiles: ["code-runner", "all"]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0}
    command: ["sh", "-c", "exec redis-server --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: mock-interview-judge0-server
    profiles: ["code-runner", "all"]
    restart: unless-stopped
    privileged: true
    # Якорь переиспользуется воркерами: server и workers обязаны читать
    # одну и ту же конфигурацию, иначе они разойдутся по БД или лимитам.
    environment: &judge0-env
      RAILS_ENV: production
      RAILS_MAX_THREADS: ${JUDGE0_MAX_THREADS:-5}
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${JUDGE0_POSTGRES_DB:-judge0}
      POSTGRES_USER: ${JUDGE0_POSTGRES_USER:-judge0}
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0}
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0}
      # Общий секрет Judge0 (заголовок X-Auth-Token). Пустое значение оставляет
      # API открытым внутри docker-сети — допустимо только локально.
      AUTHN_HEADER: X-Auth-Token
      AUTHN_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      # Сеть в песочнице выключена и не может быть включена из запроса.
      ENABLE_NETWORK: "false"
      ALLOW_ENABLE_NETWORK: "false"
    # Только на loopback: у Judge0 были CVE с побегом из песочницы,
    # наружу его публиковать нельзя.
    ports:
      - "127.0.0.1:${JUDGE0_PORT:-2358}:2358"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: mock-interview-judge0-workers
    profiles: ["code-runner", "all"]
    restart: unless-stopped
    privileged: true
    command: ["./scripts/workers"]
    environment:
      <<: *judge0-env
    depends_on:
      judge0-server:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
  rabbitmq-data:
  judge0-db-data:
