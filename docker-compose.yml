services:
  postgres:
    image: postgres:16-alpine
    container_name: mock-interview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mock_interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mock_interview}
      POSTGRES_DB: ${POSTGRES_DB:-mock_interview}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mock_interview} -d ${POSTGRES_DB:-mock_interview}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mock-interview-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mock-interview-redis}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: mock-interview-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: mock-interview-livekit
    restart: unless-stopped
    command:
      - --config-body
      - |
        port: 7880
        bind_addresses:
          - ""
        rtc:
          tcp_port: 7881
          port_range_start: 50060
          port_range_end: 50078
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-dev-local-secret-change-me-0123456789}
        webhook:
          api_key: ${LIVEKIT_WEBHOOK_API_KEY:-${LIVEKIT_API_KEY:-devkey}}
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-http://realtime:8080/webhooks/livekit}
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"       # сигнальный WS/HTTP
      - "${LIVEKIT_TCP_PORT:-7881}:7881"   # TCP media (SRTP/TCP)
      - "50060-50078:50060-50078/udp"      # UDP media (WebRTC); вне исключённых Windows UDP-портов

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: mock-interview-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/$${S3_BUCKET_NAME:-mock-interview-storage};
      /usr/bin/mc anonymous set download local/$${S3_BUCKET_NAME:-mock-interview-storage}/avatars;
      /usr/bin/mc anonymous set download local/$${S3_BUCKET_NAME:-mock-interview-storage}/public;
      exit 0;
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-mock-interview-storage}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mock-interview-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mock_interview}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mock_interview_pass}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  realtime:
    build:
      context: ./apps/realtime
      dockerfile: Dockerfile
    container_name: mock-interview-realtime
    profiles: ["realtime", "all"]
    restart: unless-stopped
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_ENABLED: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_WEBHOOK_API_KEY:?LIVEKIT_WEBHOOK_API_KEY is required}
      LIVEKIT_WEBHOOK_API_SECRET: ${LIVEKIT_WEBHOOK_API_SECRET:?LIVEKIT_WEBHOOK_API_SECRET is required}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "${REALTIME_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy


volumes:
  postgres-data:
  redis-data:
  minio-data:
  rabbitmq-data:
